    function destream(hash, key) {
        try {
            let str = atob(hash);
            let res = "";
            for (let i = 0; i < str.length; i++) {
                res += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return decodeURIComponent(res);
        } catch(e) {
            return null;
        }
    }

    function unlock() {
        const userInput = document.getElementById('pass-input').value;
        const errorDiv = document.getElementById('error');
        
        if (userInput === KEY_CHECK) {
            const decryptedHtml = destream(DATA_STREAM, userInput);
            if (decryptedHtml) {
                // Completely erase the screen and reconstruct the page fresh
                document.open();
                document.write(decryptedHtml);
                document.close();
                return;
            }
        }
        errorDiv.style.display = 'block';
        document.getElementById('pass-input').value = "";
    }
